version: "3.7"

services:
  proxy:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: auralog-proxy
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PORT=3851
      - NODE_ENV=production
    networks:
      - auralog_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auralog
    restart: unless-stopped
    ports:
      - "${APP_AURALOG_PORT:-3850}:80"
    depends_on:
      - proxy
    networks:
      - auralog_net
      - umbrel_main_network

networks:
  auralog_net:
    driver: bridge
  umbrel_main_network:
    external: true
